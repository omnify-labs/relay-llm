# HTTP context; Ubuntu libnginx-mod-http-geoip2 must be loaded first.
# Use the direct connection peer, never a country or forwarded-IP header.
geoip2 /usr/share/GeoIP/dassi-country.mmdb {
    auto_reload 5m;
    $dassi_geo_country source=$remote_addr country_code;
}
map "$request_method:$uri:$dassi_geo_country" $dassi_managed_region_blocked {
    default 0;
    ~^OPTIONS: 0;
    ~^[A-Z]+:/v1/(openai|anthropic|google|deepseek)/.*:(CN|XX|ZZ|T1|)$ 1;
}

server {
    listen 80;
    server_name relay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    client_max_body_size 100M;
    server_name relay.example.com;

    ssl_certificate /etc/ssl/certs/relay.crt;
    ssl_certificate_key /etc/ssl/private/relay.key;

    location / {
        if ($dassi_managed_region_blocked) {
            add_header Access-Control-Allow-Origin "*" always;
            return 403 '{"error":"Managed models are not available in your region. Use your own API key."}';
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeout for streaming LLM responses
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
