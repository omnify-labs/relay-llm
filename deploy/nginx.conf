# HTTP context; Ubuntu libnginx-mod-http-geoip2 must be loaded first.
geoip2 /usr/share/GeoIP/dassi-country.mmdb {
    auto_reload 5m;
    $dassi_geo_country source=$remote_addr country_code;
}
# Only Cloudflare's published connection peers may supply CF-IPCountry.
# https://www.cloudflare.com/ips-v4 and /ips-v6, checked 2026-11-23.
geo $remote_addr $dassi_cloudflare_peer {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}
map "$dassi_cloudflare_peer:$http_cf_ipcountry" $dassi_managed_country {
    default "";
    "0:" $dassi_geo_country;
    "~^1:([A-Z]{2}|T1)$" $1;
}
map $uri $dassi_managed_route {
    default 0;
    ~*^/v1/(openai|anthropic|google|deepseek)(/|$) 1;
}
map "$request_method:$dassi_managed_route:$dassi_managed_country" $dassi_managed_region_blocked {
    default 0;
    ~^OPTIONS: 0;
    ~^[^:]+:1:(XX|ZZ|T1|)$ 1;
}

server {
    listen 80;
    server_name relay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    client_max_body_size 100M;
    server_name relay.example.com;

    ssl_certificate /etc/ssl/certs/relay.crt;
    ssl_certificate_key /etc/ssl/private/relay.key;

    location / {
        default_type application/json;
        if ($dassi_managed_region_blocked) {
            add_header Access-Control-Allow-Origin "*" always;
            return 403 '{"error":"Managed models are not available in your region. Use your own API key."}';
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Long timeout for streaming LLM responses
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
