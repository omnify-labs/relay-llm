# .github/workflows/deploy.yml
name: Deploy relay
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      # Reason: vendor/litellm was a submodule (a gitlink FILE at exactly this
      # path) until #10 replaced it with a vendored JSON directory. A bare
      # directory path matches nothing in a GitHub path filter, so a
      # price-sync-only change — the exact output of litellm-prices-sync.yml —
      # would merge without ever deploying. Match the tree instead.
      - "vendor/litellm/**"
      - "Dockerfile"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: deploy-relay
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/omnify-labs/relay-llm:${{ github.sha }}
      - name: Deploy over SSH (pull + blue-green)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            # The droplet's stored GHCR login expired on 2026-07-16 ("error from
            # registry: denied" on every pull since). Log in with this run's token
            # instead of a long-lived credential on the box: it can read the
            # package this workflow just pushed, and it expires with the run.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "ghcr.io/omnify-labs/relay-llm:${{ github.sha }}"
            /srv/relay-llm/deploy.sh "ghcr.io/omnify-labs/relay-llm:${{ github.sha }}"
