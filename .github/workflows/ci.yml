name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, Typecheck & Test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-host-digital-ocean
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test --run

      - name: Test latency measurement
        run: pnpm test:benchmark

      - name: Test Cloudflare runtime
        run: pnpm test:worker

      - name: Start isolated Docker daemon
        run: bash scripts/ci-docker.sh start

      - name: Test managed-model region ingress
        run: node --test scripts/managed-region.test.mjs

      - name: Start disposable PostgreSQL
        run: |
          docker run --detach --rm --name relay-test-postgres --memory 256m \
            --env POSTGRES_PASSWORD=postgres --publish 127.0.0.1:5432:5432 postgres:16-alpine
          for attempt in $(seq 1 60); do
            if docker exec relay-test-postgres pg_isready -h 127.0.0.1 -U postgres; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Test guarded membership transitions
        run: pnpm test:redemption-database
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Test database admission and settlement
        run: pnpm test:database
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - name: Build
        run: pnpm build

      - name: Build Worker
        run: pnpm build:worker

      - name: Remove isolated Docker daemon and disposable database
        if: always() && env.CI_DOCKER_CONTAINER != ''
        run: bash scripts/ci-docker.sh stop
